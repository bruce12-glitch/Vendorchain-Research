name: Research validation
on:
  pull_request:
  push:
    branches: [main, 'fix/research-validation-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: chaincode/go.sum
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: python -m pip install -r research/requirements.txt
      - run: PYTHONPATH=research python -m unittest discover -s research/tests -v
      - run: node --test research/gateway/test.mjs
      - run: go test -race ./...
        working-directory: chaincode
      - run: go vet ./...
        working-directory: chaincode
      - run: for file in research/scripts/*.sh scripts/*.sh; do bash -n "$file"; done
  bft-integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: chaincode/go.sum
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: python -m pip install -r research/requirements.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: research/gateway
      - run: bash research/scripts/install-syft.sh
      - run: bash research/scripts/bootstrap-bft.sh
      - run: bash research/scripts/integration-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bft-integration-evidence
          include-hidden-files: true
          path: |
            research/gateway/package-lock.json
            .runtime/network-metadata.json
            .runtime/channel-config.json
            .runtime/container-images.txt
            .runtime/gateway.log
            .runtime/api.log
            .runtime/bft-healthy/
            .runtime/bft-one-crash/
